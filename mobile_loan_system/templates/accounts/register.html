{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h3 class="mb-4">Create Your Account</h3>
        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            <h6 class="text-muted mb-3">Login Details</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone_number" class="form-control" required>
                </div>
            </div>

            <h6 class="text-muted mb-3">Address</h6>
            <div class="row g-3 mb-3">
                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="2" required></textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pincode</label>
                    <input type="text" name="pincode" class="form-control">
                </div>
            </div>

            <h6 class="text-muted mb-3">KYC & Income (used for loan eligibility)</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">ID Proof Type</label>
                    <select name="id_proof_type" class="form-select">
                        <option value="AADHAR">Aadhar Card</option>
                        <option value="PAN">PAN Card</option>
                        <option value="VOTER">Voter ID</option>
                        <option value="PASSPORT">Passport</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">ID Proof Number</label>
                    <input type="text" name="id_proof_number" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Monthly Income (₹)</label>
                    <input type="number" step="0.01" name="monthly_income" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Create Account</button>
        </form>
        <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
