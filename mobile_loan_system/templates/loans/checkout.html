{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h3 class="mb-4"><i class="bi bi-bag-check"></i> Checkout</h3>

        <div class="card mb-4 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                {% if product.image %}
                    <img src="{{ product.image.url }}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;">
                {% else %}
                    <div class="product-img-placeholder rounded" style="width:80px;height:80px;font-size:2rem;"><i class="bi bi-phone"></i></div>
                {% endif %}
                <div>
                    <h6 class="mb-0">{{ product }}</h6>
                    <span class="fw-bold text-primary">₹{{ product.price }}</span> / unit
                </div>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" name="quantity" class="form-control" value="1" min="1" max="{{ product.stock_quantity }}">
            </div>

            <label class="form-label d-block">How would you like to pay?</label>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <input type="radio" class="btn-check" name="payment_type" id="pay_cash" value="CASH" checked>
                    <label class="btn btn-outline-primary w-100 py-3" for="pay_cash">
                        <i class="bi bi-cash-stack fs-4 d-block mb-1"></i> Pay Full Amount
                    </label>
                </div>
                <div class="col-md-6">
                    <input type="radio" class="btn-check" name="payment_type" id="pay_loan" value="LOAN">
                    <label class="btn btn-outline-primary w-100 py-3" for="pay_loan">
                        <i class="bi bi-calendar2-check fs-4 d-block mb-1"></i> Buy on Loan (EMI)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
